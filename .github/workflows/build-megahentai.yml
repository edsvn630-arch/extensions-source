name: Build MegaHentai
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew :src:pt:megahentai:assembleDebug -x spotlessKotlinCheck -x spotlessGradleCheck -x spotlessJavaCheck -x spotlessXmlCheck
      - uses: actions/upload-artifact@v4
        with:
          name: megahentai-apk
          path: src/pt/megahentai/build/outputs/apk/debug/*.apk
